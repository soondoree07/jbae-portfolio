  <meta charset="utf-8">

  <meta property="og:type" content="website">

  <meta property="og:title" content="배정혜 J.Bae | 한국화 작가 포트폴리오">
  <meta property="og:description" content="한복천에 바느질과 먹선으로 꿈결·물결·바람결을 잇는 한국화 작가 배정혜의 작품 포트폴리오. 2007년부터 오늘까지의 작업을 시기별로 봅니다.">
  <meta property="og:image" content="https://jbae.art/og-image.jpg">
  <meta property="og:url" content="https://jbae.art/">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#E8E0D3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body id="top">
  <header class="masthead">
    <a class="brand" href="index.html">
      <span class="brand-ko">배정혜</span>
      <span class="brand-en">J.Bae</span>
    </a>
    <nav class="masthead-nav" aria-label="주요 메뉴">
      <a href="index.html#works">작품</a>
      <a href="index.html#about">작가</a>
      <a href="index.html#cv-band">약력</a>
      <a class="is-cta" href="index.html#contact">문의</a>
    </nav>
  </header>

  <main>
    <section class="page hero">
      <div class="hero-inner">
        <div>
          <span class="hero-en"></span>
          <h1 class="hero-name"></h1>
          <p class="hero-tagline"></p>
        </div>
        <figure class="hero-plate"></figure>
      </div>
    </section>

    <section class="page band" id="works">
      <div class="band-head">
        <span class="eyebrow">Works</span>
        <h2 class="section-title">작품 연보</h2>
      </div>
      <div class="chapters"></div>
    </section>

    <section class="page band" id="about">
      <div class="band-head">
        <span class="eyebrow">Artist</span>
        <h2 class="section-title">작가</h2>
      </div>
      <div class="about reveal">
        <p class="about-bio"></p>
        <dl class="about-lines"></dl>
      </div>
    </section>

    <section class="page band" id="cv-band">
      <div class="band-head">
        <span class="eyebrow">Curriculum Vitae</span>
        <h2 class="section-title">약력</h2>
      </div>
      <div class="cv"></div>
    </section>

    <section class="page band" id="contact">
      <div class="band-head">
        <span class="eyebrow">Contact</span>
        <h2 class="section-title">문의하기</h2>
      </div>
      <div class="contact-links reveal"></div>
    </section>
  </main>

  <footer class="page">
    <div class="colophon"></div>
  </footer>

  <script type="module" src="js/home.js"></script>
</body>
</html>
